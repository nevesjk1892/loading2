<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Validação de Dados - gov.br</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rawline', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 320px;
            width: 100%;
        }

        /* Logo gov.br */
        .logo-container {
            margin-bottom: 30px;
        }

        .logo-govbr {
            width: 140px;
            height: auto;
        }

        /* Área de animação */
        .animation-area {
            position: relative;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Spinner de loading */
        .spinner-container {
            position: relative;
            width: 70px;
            height: 70px;
            margin-bottom: 20px;
        }

        .spinner {
            width: 70px;
            height: 70px;
            border: 4px solid #e9ecef;
            border-top: 4px solid #1351B4;
            border-right: 4px solid #FFCD07;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ícone de sucesso */
        .success-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #168821 0%, #1a9e28 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(22, 136, 33, 0.3);
        }

        .success-icon svg {
            width: 35px;
            height: 35px;
            stroke: white;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-path {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            transition: stroke-dashoffset 0.6s ease 0.2s;
        }

        /* Texto de status */
        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #1351B4;
            min-height: 24px;
            transition: opacity 0.3s ease;
        }

        .status-text.success {
            color: #168821;
        }

        /* Dots animados */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: dots 1.4s infinite;
            opacity: 0;
        }

        .loading-dots span:nth-child(1) { animation-delay: 0s; }
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dots {
            0%, 20% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Estado de sucesso */
        .container.success .spinner {
            opacity: 0;
            transform: scale(0);
        }

        .container.success .success-icon {
            opacity: 1;
            transform: scale(1);
        }

        .container.success .checkmark-path {
            stroke-dashoffset: 0;
        }

        /* Barra de progresso sutil */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e9ecef;
            border-radius: 2px;
            margin-top: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1351B4, #FFCD07, #168821);
            background-size: 200% 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 6s linear;
        }

        .container.success .progress-fill {
            width: 100%;
            background: #168821;
            transition: none;
        }

        /* Rodapé gov.br */
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container" id="container">

        <!-- Área de animação -->
        <div class="animation-area">
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="success-icon">
                    <svg viewBox="0 0 24 24">
                        <path class="checkmark-path" d="M4 12l6 6L20 6"/>
                    </svg>
                </div>
            </div>
            <p class="status-text" id="statusText">
                Desbloqueando cartão...<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
            </p>
        </div>

        <!-- Barra de progresso -->
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <script>
        // Configuração de tempo
        const LOADING_TIME = 6000; // 6 segundos

        // Elementos
        const container = document.getElementById('container');
        const statusText = document.getElementById('statusText');
        const progressFill = document.getElementById('progressFill');

        // Iniciar animação de progresso
        window.addEventListener('load', function() {
            // Pequeno delay para garantir que a transição funcione
            setTimeout(() => {
                progressFill.style.width = '100%';
            }, 100);

            // Após 6 segundos, mostrar sucesso
            setTimeout(() => {
                showSuccess();
            }, LOADING_TIME);
        });

        function showSuccess() {
            // Adicionar classe de sucesso
            container.classList.add('success');
            
            // Atualizar texto
            statusText.innerHTML = 'Cartão desbloqueado com sucesso!';
            statusText.classList.add('success');
        }
    </script>
</body>
</html>
